name = "emdomanus/anatomy"
version = "0.3.0"
description = "Named sockets and hierarchical tags read from an asset's element table, composed across sources by priority. Plain Luau: no engine API."
license = "MIT"
authors = ["emdomanus"]
repository = "https://github.com/emdomanus/anatomy"
private = true

includes = [
	"pesde.toml",
	"LICENSE",
	"README.md",
	"CHANGELOG.md",
	"src/**/*.luau",
]

[target]
environment = "luau"
lib = "src/shared.luau"

[indices]
default = "https://github.com/pesde-pkg/index"

[dependencies]
luauUtils = { repo = "emdomanus/luauUtils", rev = "51f60518efde736b5497c0cbd2121c0ea4c517f7" }
