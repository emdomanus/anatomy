name = "emdomanus/anatomy"
version = "0.1.0"
description = "Renderable anatomy, socket, surface, and mounting primitives for Roblox."
license = "MIT"
authors = ["emdomanus"]
repository = "https://github.com/emdomanus/anatomy"

includes = [
	"pesde.toml",
	"LICENSE",
	"README.md",
	"src/**/*.luau",
]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"

[dependencies]
hook = { name = "emdomanus/hook", version = "^0.1.0" }
